name: Testar e publicar

# Cada push na main roda os testes. Se a VERSAO ainda não tiver release, o próprio workflow
# cria a tag vX.Y.Z, monta o pacote e publica a release (não é preciso criar tag à mão).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o teste de atualização usa a 4.0 do histórico para simular um Mac desatualizado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Testes (API da Meta simulada, nenhum token real)
        run: bash testes/rodar.sh

  segredos:
    # Varre o código e todo o histórico atrás de token da Meta, chaves e segredos. Se achar algo, nada é publicado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (versão fixa, conferida pelo checksum oficial)
        run: |
          V=8.21.2
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          curl -sSfL -o gitleaks.tar.gz "$BASE/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${V}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procurar segredos no código e no histórico
        run: ./gitleaks git --redact --no-banner --verbose --config .gitleaks.toml

  publicar:
    needs: [testes, segredos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão nova?
        id: versao
        run: |
          V="v$(cat VERSAO)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "A release $V já existe; nada a publicar."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: Montar pacote
        if: steps.versao.outputs.publicar == 'sim'
        run: bash empacotar.sh
      - name: Notas da versão
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          awk -v v="## $(cat VERSAO)" '$0==v{on=1;next} /^## /{on=0} on' NOVIDADES.md > notas.md
          test -s notas.md || { echo "Falta a seção '## $(cat VERSAO)' no NOVIDADES.md"; exit 1; }
          cat notas.md
      - name: Publicar release
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" dist/impera-meta-mcp.zip dist/impera-meta-mcp.zip.sha256 \
            --target "$GITHUB_SHA" --title "Impera Meta MCP ${{ steps.versao.outputs.tag }}" --notes-file notas.md --latest
